[package]
name = "trans-music"
version = "0.1.0"
edition = "2024"

[dependencies]
lexopt = "0.3"
symphonia = { version = "0.6", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav", "all-meta", "opt-simd"] }
symphonia-core = "0.6"
ebur128 = "0.1"
rubato = "5"
ogg = "0.9"
lofty = "0.25"
opusic-c = "1"

[profile.release]
lto = true
codegen-units = 1
