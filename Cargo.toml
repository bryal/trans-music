[package]
name = "trans-music"
version = "0.2.0"
edition = "2024"
description = "Mirror a music library as loudness-normalized Opus."
authors = ["Jojo <jo@jo.zone>"]
repository = "https://github.com/bryal/trans-music"
license = "GPL-3.0-only"

[dependencies]
symphonia = { version = "0.6", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav", "all-meta", "opt-simd"] }
ebur128 = "0.1"
rubato = "5"
ogg = "0.9"
lofty = "0.25"
opusic-c = "1"
xflags = "0.3"

[profile.release]
lto = true
codegen-units = 1
